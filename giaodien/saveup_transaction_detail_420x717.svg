  <path d="M261 631H271M263 631V628.5C263 626.6 264.6 625 266.5 625H270.5C272.4 625 274 626.6 274 628.5V631M262 631L263.3 647H273.7L275 631" stroke="#F04444" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="310" y="647" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#F04444">Xóa</text>
