<?xml version="1.0" encoding="UTF-8"?>
<svg width="420" height="717" viewBox="0 0 420 717" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="420" y2="717" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FCFA"/>
      <stop offset="1" stop-color="#EEF5FB"/>
    </linearGradient>
    <linearGradient id="hero" x1="24" y1="88" x2="396" y2="220" gradientUnits="userSpaceOnUse">
